<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="50%" stop-color="#12151E" />
      <stop offset="100%" stop-color="#090B0F" />
    </linearGradient>

    <!-- Outer Rim Specular Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <!-- Electric Cyan-Blue Primary Neon Gradient -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Radial Sector Gradient (Cyan to Indigo) -->
    <linearGradient id="bladeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Muted Sector Gradient -->
    <linearGradient id="bladeMuted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222838" />
      <stop offset="100%" stop-color="#161A24" />
    </linearGradient>

    <!-- Glowing Drop Glyph Gradient -->
    <linearGradient id="dropGlyph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Center Hub Radial Shadow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A202E" />
      <stop offset="85%" stop-color="#0D1017" />
      <stop offset="100%" stop-color="#080A0E" />
    </radialGradient>

    <!-- Deep Ambient Drop Shadow -->
    <filter id="squircleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>

    <!-- Neon Glow Filter for Core Glyph -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Squircle with High-End Glass Rim -->
  <rect x="14" y="14" width="228" height="228" rx="56" ry="56"
        fill="url(#bgGrad)"
        stroke="url(#rimGrad)"
        stroke-width="1.75"
        filter="url(#squircleShadow)" />

  <!-- 2. Subtle Background Grid Pattern -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 6">
    <circle cx="128" cy="128" r="92" fill="none" />
    <circle cx="128" cy="128" r="62" fill="none" />
  </g>

  <!-- 3. Dynamic Radial Aperture Blades (8 Curated Sectors) -->
  <g transform="rotate(-22.5 128 128)">
    <!-- Sector 0: Active Glowing Hero Blade (Top) -->
    <path d="M 128,34 A 94,94 0 0,1 194.5,61.5 L 168,88 A 56,56 0 0,0 128,72 Z"
          fill="url(#bladeActive)"
          stroke="#38BDF8"
          stroke-width="1.25"
          filter="url(#neonGlow)"
          opacity="0.95" />

    <!-- Sector 1: Transitioning Cyan-Blue Blade -->
    <path d="M 198.5,65.5 A 94,94 0 0,1 222,128 L 184,128 A 56,56 0 0,0 171.5,91.5 Z"
          fill="url(#primaryNeon)"
          stroke="rgba(56,189,248,0.4)"
          stroke-width="1"
          opacity="0.85" />

    <!-- Sector 2: Deep Blue Blade -->
    <path d="M 222,134 A 94,94 0 0,1 194.5,194.5 L 168,168 A 56,56 0 0,0 184,134 Z"
          fill="#1D2A40"
          stroke="rgba(255,255,255,0.08)"
          stroke-width="1" />

    <!-- Sector 3: Dark Slate Blade -->
    <path d="M 190.5,198.5 A 94,94 0 0,1 128,222 L 128,184 A 56,56 0 0,0 164.5,171.5 Z"
          fill="url(#bladeMuted)"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="1" />

    <!-- Sector 4: Bottom Blade -->
    <path d="M 122,222 A 94,94 0 0,1 61.5,194.5 L 88,168 A 56,56 0 0,0 122,184 Z"
          fill="url(#bladeMuted)"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="1" />

    <!-- Sector 5: Left-Bottom Blade -->
    <path d="M 57.5,190.5 A 94,94 0 0,1 34,128 L 72,128 A 56,56 0 0,0 84.5,164.5 Z"
          fill="url(#bladeMuted)"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="1" />

    <!-- Sector 6: Left Blade -->
    <path d="M 34,122 A 94,94 0 0,1 61.5,61.5 L 88,88 A 56,56 0 0,0 72,122 Z"
          fill="url(#bladeMuted)"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="1" />

    <!-- Sector 7: Top-Left Transition Blade -->
    <path d="M 65.5,57.5 A 94,94 0 0,1 122,34 L 122,72 A 56,56 0 0,0 91.5,84.5 Z"
          fill="#1A283C"
          stroke="rgba(56,189,248,0.25)"
          stroke-width="1" />
  </g>

  <!-- 4. Inner Aperture Core Disc (Precision Center Island) -->
  <circle cx="128" cy="128" r="48"
          fill="url(#hubGlow)"
          stroke="rgba(56, 189, 248, 0.45)"
          stroke-width="2" />

  <circle cx="128" cy="128" r="43"
          fill="none"
          stroke="rgba(255, 255, 255, 0.08)"
          stroke-width="1" />

  <!-- 5. Futuristic Drop & Teleport Glyph (Center Stage) -->
  <!-- Aerodynamic Drop Arrow -->
  <path d="M 128,100 L 128,142"
        fill="none"
        stroke="url(#dropGlyph)"
        stroke-width="4.5"
        stroke-linecap="round" />

  <path d="M 112,128 L 128,144 L 144,128"
        fill="none"
        stroke="url(#dropGlyph)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Quantum Drop Target Point / Pulse -->
  <circle cx="128" cy="156" r="3.5"
          fill="#00F0FF"
          filter="url(#neonGlow)" />

  <!-- Subtle Top Specular Curved Glare on Squircle -->
  <path d="M 28,68 C 28,38 48,22 78,20 C 130,17 186,17 228,48 C 196,44 140,46 94,54 C 54,61 36,82 28,68 Z"
        fill="rgba(255,255,255,0.04)" />
</svg>
