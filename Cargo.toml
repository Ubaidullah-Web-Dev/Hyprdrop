[package]
name = "hyprdrop"
version = "0.1.1"
edition = "2024"
authors = ["Hyprdrop Contributors"]
description = "Lightweight, production-grade radial drag-and-drop file converter, studio editor, and drop-shelf for Hyprland"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_4"] }
gtk4-layer-shell = "0.8"
cairo-rs = { version = "0.22", features = ["png", "pdf", "svg"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "avif", "tiff", "bmp", "ico", "gif"] }
lopdf = "0.45"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
tempfile = "3.17"
kamadak-exif = "0.5"
open = "5.3"
dirs = "6.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
